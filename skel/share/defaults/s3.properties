#  -----------------------------------------------------------------------
#     Default values for S3 doors
#  -----------------------------------------------------------------------
@DEFAULTS_HEADER@

#  ---- Cell name of S3 door
#
s3.cell.name=S3-${host.name}

#  ---- Named queues to consume from
#
#   A service can consume messages from named queues. Other services can
#   write messages to such queues. A named queue has an unqualified cell
#   address, that is, an address without a domain name.
#
#   This property contains a comma separated list of named queues to
#   consume from.
#
s3.cell.consume = ${s3.cell.name}

#  ---- Message topics to subscribe to
#
s3.cell.subscribe=${s3.loginbroker.request-topic}

#  ---- Root of the S3 door
#
#   Buckets are the directories below this directory; object keys are
#   paths below a bucket, with '/' separating directories.  If a user's
#   root directory, as assigned by gPlazma, is below this directory, the
#   user's buckets are the directories below the user's root instead.
#   Users whose root directory is outside this directory cannot use the
#   door.
#
s3.root=/

#  ---- TCP port of the S3 door
#
s3.net.port=9000

#  ---- Interface to listen on
#
#   Empty to listen on all interfaces.
#
s3.net.listen=${dcache.net.listen}

#  ---- Address of the door as seen by pools
#
#   The door relays all data between S3 clients and pools.  Pools accept
#   the door's data connections from this address; empty for the address
#   of the local host.
#
s3.net.internal=

#  ---- Host name for virtual-hosted-style requests
#
#   S3 clients address a bucket either in the path
#   (https://s3.example.org/bucket/key) or in the host name
#   (https://bucket.s3.example.org/key).  The latter needs a wildcard DNS
#   entry and server certificate, and this property set to the host name
#   under which buckets are addressed (s3.example.org).  Empty to support
#   path-style requests only.
#
s3.net.virtual-host=

#  ---- Whether to use HTTP or HTTPS
#
#   S3 clients send their access key in every request and sign requests
#   with the secret key, which the secret never leaves.  The data,
#   however, is only protected with HTTPS.  For HTTPS a server certificate
#   and the CA certificates are needed, by default in /etc/grid-security.
#   Client certificates are not used.
#
(one-of?http|https)s3.authn.protocol = https

(immutable)s3.authn.connector-for-http = PLAIN
(immutable)s3.authn.connector-for-https = TLS
(immutable)s3.authn.connector = ${s3.authn.connector-for-${s3.authn.protocol}}

#  ---- Request signatures accepted
#
#   aws-v4 accepts AWS Signature Version 4 only; aws-v2-or-v4 also accepts
#   the deprecated Version 2 used by some old clients.
#
(one-of?aws-v4|aws-v2-or-v4)s3.authn.signature = aws-v2-or-v4

#  ---- Maximum clock difference between client and door
#
#   Signed requests carry their creation time; requests whose time is
#   further from the door's clock are refused (RequestTimeTooSkewed).
#
s3.authn.max-time-skew = 900
(one-of?SECONDS|MINUTES|HOURS)s3.authn.max-time-skew.unit = SECONDS

#  ---- S3 access keys
#
#   File with the secret keys of S3 clients, one pair per line:
#
#       <access-key> <secret>
#
#   Empty lines and lines starting with # are ignored.  The file is
#   re-read when it changes; if any line is invalid, no access key is
#   accepted until the file is fixed.  The file holds plain-text secrets
#   and should be readable only by the user running dCache.
#
#   Access keys are mapped to dCache users by gPlazma, e.g. with the
#   multimap line:
#
#       s3:<access-key>    username:<user>
#
s3.authn.keystore.file=${dcache.paths.etc}/s3-keys.conf

#  ---- Server certificate and CA certificates for HTTPS
#
s3.authn.hostcert.cert=${dcache.authn.hostcert.cert}
s3.authn.hostcert.key=${dcache.authn.hostcert.key}
s3.authn.hostcert.refresh=${dcache.authn.hostcert.refresh}
(one-of?MILLISECONDS|SECONDS|MINUTES|HOURS|DAYS|${dcache.authn.hostcert.refresh.unit})s3.authn.hostcert.refresh.unit=${dcache.authn.hostcert.refresh.unit}
s3.authn.capath=${dcache.authn.capath}
s3.authn.capath.refresh=${dcache.authn.capath.refresh}
(one-of?MILLISECONDS|SECONDS|MINUTES|HOURS|DAYS|${dcache.authn.capath.refresh.unit})s3.authn.capath.refresh.unit=${dcache.authn.capath.refresh.unit}
s3.authn.namespace-mode=${dcache.authn.namespace-mode}
s3.authn.crl-mode=${dcache.authn.crl-mode}
s3.authn.ocsp-mode=${dcache.authn.ocsp-mode}
s3.authn.ciphers = ${dcache.authn.ciphers}

#  ---- Cell addresses and timeouts of other services
#
s3.service.pnfsmanager=${dcache.service.pnfsmanager}
s3.service.pnfsmanager.timeout = 120000
(one-of?MILLISECONDS|SECONDS|MINUTES|HOURS|DAYS)s3.service.pnfsmanager.timeout.unit=MILLISECONDS

s3.service.poolmanager=${dcache.service.poolmanager}
s3.service.poolmanager.timeout = 300000
(one-of?MILLISECONDS|SECONDS|MINUTES|HOURS|DAYS)s3.service.poolmanager.timeout.unit=MILLISECONDS

s3.service.pool.timeout = 10000
(one-of?MILLISECONDS|SECONDS|MINUTES|HOURS|DAYS)s3.service.pool.timeout.unit=MILLISECONDS

s3.service.pinmanager=${dcache.service.pinmanager}
s3.service.pinmanager.timeout = 60000
(one-of?MILLISECONDS|SECONDS|MINUTES|HOURS|DAYS)s3.service.pinmanager.timeout.unit=MILLISECONDS

s3.service.gplazma=${dcache.service.gplazma}
s3.service.gplazma.timeout = 180000
(one-of?MILLISECONDS|SECONDS|MINUTES|HOURS|DAYS)s3.service.gplazma.timeout.unit=MILLISECONDS

s3.service.billing=${dcache.topic.billing}

#  ---- Caching of gPlazma logins
#
#   The door asks gPlazma which user an access key belongs to and caches
#   the answer.  The secret is checked against the key file on every
#   request, so removing a key from the file takes effect at once.
#
s3.service.gplazma.cache.size = 1024
s3.service.gplazma.cache.timeout = 60
(one-of?MILLISECONDS|SECONDS|MINUTES|HOURS|DAYS)s3.service.gplazma.cache.timeout.unit = SECONDS

#  ---- Mover queue
#
#   The name of the mover queue on the pools used for S3 transfers.
#   Empty for the default queue.
#
s3.mover.queue =

#  ---- Mover timeouts
#
#   How long to wait for a pool to be selected and a mover to start; how
#   long to wait for data from the mover; how long to wait for the pool to
#   confirm a transfer; and how long to wait for a killed mover to end.
#
s3.mover.timeout = 180000
(one-of?MILLISECONDS|SECONDS|MINUTES|HOURS|DAYS)s3.mover.timeout.unit=MILLISECONDS
s3.mover.read-timeout = 300000
(one-of?MILLISECONDS|SECONDS|MINUTES|HOURS|DAYS)s3.mover.read-timeout.unit=MILLISECONDS
s3.mover.transfer-confirmation-timeout = 60000
(one-of?MILLISECONDS|SECONDS|MINUTES|HOURS|DAYS)s3.mover.transfer-confirmation-timeout.unit=MILLISECONDS
s3.mover.kill-timeout = 1500
(one-of?MILLISECONDS|SECONDS|MINUTES|HOURS|DAYS)s3.mover.kill-timeout.unit=MILLISECONDS

#  ---- Listing limit
#
#   A listing without delimiter walks the directory tree below the
#   prefix.  Once it has read this many directory entries and found at
#   least one key, it returns a shorter page; the client continues from
#   its last key.  A single directory is always read in full.
#
s3.limits.list.max-entries = 10000

#  ---- Multipart uploads
#
#   Clients upload large objects in parts, which the door keeps in the
#   bucket's hidden directory .s3-multipart until the client completes or
#   aborts the upload.  Uploads that are neither completed nor aborted
#   within this time are removed: every hour from the buckets directly
#   below s3.root, and from any bucket when a new upload is started in it.
#   Files of uploads that were interrupted, e.g. by a door restart, are
#   removed after this time when their bucket is deleted.
#
s3.limits.multipart.max-age = 7
(one-of?MINUTES|HOURS|DAYS)s3.limits.multipart.max-age.unit = DAYS

#  ---- Restoring objects from tape
#
#   Files whose only copy is on tape (no pool has a replica) have storage
#   class GLACIER and must be restored (RestoreObject) before they can be
#   read.  A restore pins
#   the file on disk for the number of days the client asks for, but at
#   most this many days.
#
s3.restore.max-days = 30

#  ---- Login broker configuration
#
s3.loginbroker.request-topic=${dcache.loginbroker.request-topic}
s3.loginbroker.update-topic=${dcache.loginbroker.update-topic}
s3.loginbroker.update-period = ${dcache.loginbroker.update-period}
(one-of?MILLISECONDS|SECONDS|MINUTES|HOURS|DAYS|${dcache.loginbroker.update-period.unit})\
  s3.loginbroker.update-period.unit=${dcache.loginbroker.update-period.unit}
s3.loginbroker.update-threshold = ${dcache.loginbroker.update-threshold}
s3.loginbroker.version=1.0.0
s3.loginbroker.family=s3
s3.loginbroker.address=
s3.loginbroker.port=${s3.net.port}
s3.loginbroker.tags=${dcache.loginbroker.tags}
s3.loginbroker.root=${s3.root}

#  ---- Jetty limits
#
s3.limits.threads.max=500
s3.limits.threads.min=1
s3.limits.threads.idle-time=60
(one-of?MILLISECONDS|SECONDS|MINUTES|HOURS|DAYS)s3.limits.threads.idle-time.unit=SECONDS
s3.limits.queue-length=500
s3.limits.acceptors=1
s3.limits.backlog=1024
s3.limits.idle-time=300
(one-of?MILLISECONDS|SECONDS|MINUTES|HOURS|DAYS)s3.limits.idle-time.unit=SECONDS
s3.limits.graceful-shutdown=2
(one-of?MILLISECONDS|SECONDS|MINUTES|HOURS|DAYS)s3.limits.graceful-shutdown.unit=SECONDS
